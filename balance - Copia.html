
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balance Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header><h1>Balance Tracker</h1></header>

  <nav>
    <a href="index.html">HOME</a>
    <a href="balance.html">BALANCE TRACKER</a>
    <a href="ocs.html">OC ARCHIVE</a>
    <a href="blog.html">PERSONAL BLOG</a>
    <button onclick="window.location.href='countdown.html'">
  COUNTDOWNS
</button>
  </nav>

  <main>
    <section class="wide">
      <h2>Current Balance</h2>
      <p class="balance-total" id="balance-amount">R$ 0,00</p>
    </section>

    <section>
      <h2>Add Transaction</h2>
      <form id="transaction-form">
        <label for="transaction-description">Description</label>
        <input type="text" id="transaction-description"
          placeholder="e.g. Salary" required>

        <label for="transaction-amount">Amount (R$)</label>
        <input type="number" id="transaction-amount"
          min="0.01" step="0.01" placeholder="0.00" required>

        <label for="transaction-type">Type</label>
        <select id="transaction-type">
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>

        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <section class="wide">
      <h2>Transactions</h2>
      <ul id="transaction-list"></ul>
      <p id="empty-message">No transactions yet.</p>
    </section>
  </main>

  <div class="date-time-note">
    <span id="current-date">Loading date...</span>
    <span id="current-time">Loading time...</span>
  </div>
</body>
</html>
<button onclick="window.location.href='countdown.html'">
  COUNTDOWNS
</button>
